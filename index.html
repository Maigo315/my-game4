<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔物娘 戦闘プロトタイプ</title>
<style>
:root {
  --bg:#0f1220;
  --panel:#181d2d;
  --panel2:#20263a;
  --text:#f4f7ff;
  --muted:#aeb8cf;
  --line:#303950;
  --accent:#7ed8ff;
  --danger:#ff7f91;
  --good:#93e6a8;
  --gold:#ffd978;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#0b0e18,#111827 45%,#0b0e18);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
.app{
  width:min(100%,520px);
  margin:0 auto;
  padding:12px 12px 28px;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:10px;
}
.title{font-size:18px;font-weight:800;letter-spacing:.02em}
.turn{
  font-size:13px;color:var(--gold);background:#2a2434;
  border:1px solid #4c3f58;border-radius:999px;padding:6px 10px;
}
.card{
  background:rgba(24,29,45,.94);
  border:1px solid var(--line);
  border-radius:16px;
}
.enemy{
  padding:12px;margin-bottom:10px;
}
.enemy-head{
  display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;
}
.portrait{
  width:92px;height:92px;border-radius:14px;overflow:hidden;
  background:#0b0e18;border:1px solid #3b4561;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.name-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-size:18px;font-weight:800}
.tag{font-size:11px;color:var(--muted)}
.bar-wrap{margin-top:8px}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar{height:12px;background:#0e1321;border-radius:999px;overflow:hidden;border:1px solid #283046}
.fill{height:100%;transition:width .2s ease}
.hp-fill{background:linear-gradient(90deg,#ff647c,#ff9a86)}
.gauge-fill{background:linear-gradient(90deg,#5dc8ff,#a98aff)}
.status-line{margin-top:8px;font-size:12px;color:#ffd0d7;min-height:18px}
.party{
  display:grid;gap:8px;margin-bottom:10px;
}
.unit{
  display:grid;grid-template-columns:68px 1fr;gap:10px;
  padding:9px;
}
.unit .portrait{width:68px;height:68px;border-radius:12px}
.unit-name{font-weight:800}
.unit-meta{font-size:11px;color:var(--muted);margin-top:2px}
.mini-bars{display:grid;gap:5px;margin-top:6px}
.resource-row{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;
}
.pill{
  font-size:11px;padding:4px 7px;border-radius:999px;
  border:1px solid #3a4561;color:#dfe6f8;background:#151a29;
}
.pill.ready{color:#081018;background:var(--gold);border-color:var(--gold);font-weight:800}
.pill.dead{color:#fff;background:#5a2430;border-color:#8f394c}
.controls{
  position:sticky;bottom:0;
  background:linear-gradient(180deg,rgba(15,18,32,0),rgba(15,18,32,.96) 24%);
  padding-top:18px;
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{
  min-height:50px;border:0;border-radius:14px;
  font-size:16px;font-weight:800;cursor:pointer;
}
button:disabled{opacity:.45;cursor:not-allowed}
.attack{background:#f3f6fb;color:#131722}
.chain{background:var(--accent);color:#07131a}
.secondary{
  width:100%;margin-top:8px;min-height:42px;background:#252c40;color:#dfe6f8;
  border:1px solid #39445f;font-size:14px;
}
.chain-panel{
  margin-top:8px;padding:10px;display:none;
}
.chain-panel.show{display:block}
.chain-title{font-weight:800;font-size:14px;margin-bottom:8px}
.chain-unit{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 0;border-top:1px solid #2d3650;
}
.chain-unit:first-of-type{border-top:0}
.chain-left{display:flex;align-items:center;gap:8px;min-width:0}
.chain-left img{width:34px;height:34px;border-radius:8px;object-fit:cover}
.chain-desc{font-size:11px;color:var(--muted);margin-top:2px}
.switch{display:flex;align-items:center;gap:6px;font-size:12px}
.switch input{width:20px;height:20px}
.chain-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.confirm{background:var(--good);color:#07130a}
.cancel{background:#2b3246;color:#e5e9f4;border:1px solid #404a65}
.log-card{margin-top:10px;padding:10px}
.log-title{font-size:13px;font-weight:800;margin-bottom:8px}
.log{
  background:#0c101b;border:1px solid #222a3b;border-radius:12px;padding:10px;
  height:180px;overflow:auto;font-size:12px;line-height:1.55;color:#cbd5e1;
}
.log .turnline{color:var(--gold);font-weight:800;margin-top:6px}
.log .damage{color:#ffb1bd}
.log .heal{color:#9cf1b0}
.log .system{color:#9ac7ff}
.help{margin-top:8px;font-size:11px;line-height:1.55;color:var(--muted)}
@media (max-width:370px){
  .enemy-head{grid-template-columns:80px 1fr}
  .portrait{width:80px;height:80px}
  .unit{grid-template-columns:60px 1fr}
  .unit .portrait{width:60px;height:60px}
}
</style>
</head>

      party: baseParty.map(x => ({
        ...x,
        maxHp: +(x.hp * blueGel).toFixed(1),
        curHp: +(x.hp * blueGel).toFixed(1),
        gauge:0, dead:false, statuses:[]
      })),
      battleOver:false,
      chainOpen:false
    };
    logEl.innerHTML = "";
    addLog("戦闘開始。敵・犬娘が現れた。","system");
    render();
  }

  function totalAmp() {
    const timed = state.enemy.damageAmpTimed.reduce((a,b)=>a+b.value,0);
    return state.enemy.damageAmpPermanent + timed;
  }

  function effectiveAtk(unit) {
    let atk = unit.atk;
    if (unit.id === "dog" && state.party.every(u => u.statuses.length === 0)) atk += 5;
    return atk;
  }

  function round1(n) {
    return Math.round(n * 10) / 10;
  }

  function addLog(text, cls="") {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addTurnHeader() {
    addLog(`TURN ${state.turn}`,"turnline");
  }

  function gainGaugeFromHit(unit, damage) {
    if (unit.dead) return;
    const ratio = damage / unit.maxHp;
    const gain = ratio >= .75 ? 50 : ratio >= .5 ? 25 : 10;
    unit.gauge = Math.min(100, unit.gauge + gain);
    addLog(`${unit.name}：被弾でスキルゲージ +${gain}`,"system");
  }

  function dealToEnemy(unit, baseDamage, source, grantsGauge=true) {
    if (state.enemy.dead) return 0;
    const amp = totalAmp();
    const dmg = round1(baseDamage * (1 + amp / 100));
    state.enemy.hp = Math.max(0, round1(state.enemy.hp - dmg));
    addLog(`${unit.name}の${source}！ 敵に ${dmg} ダメージ。`,"damage");
    if (grantsGauge && source === "通常攻撃") {
      unit.gauge = Math.min(100, unit.gauge + 10);
      addLog(`${unit.name}：通常攻撃でスキルゲージ +10`,"system");
    }
    if (state.enemy.hp <= 0) {
      state.enemy.dead = true;
      endBattle();
    }
    return dmg;
  }

  function receiveDamage(unit, amount, source) {
    if (unit.dead) return;
    let dmg = amount;
    if (unit.id === "slime") dmg *= .95;
    dmg = round1(dmg);
    unit.curHp = Math.max(0, round1(unit.curHp - dmg));
    addLog(`${source} → ${unit.name}に ${dmg} ダメージ。`,"damage");
    gainGaugeFromHit(unit,dmg);
    if (unit.id === "slime") {
      state.reason = Math.min(10, state.reason + 1);
      addLog(`ぷるぷるボディ：理力 +1（${state.reason}）`,"system");
    }
    if (unit.curHp <= 0) {
      unit.dead = true;
      addLog(`${unit.name}は戦闘不能！`,"damage");
    }
  }

  function aliveParty() {
    return state.party.filter(u => !u.dead);
  }

  function randomAlive(exclude=[]) {
    const list = aliveParty().filter(u => !exclude.includes(u.id));
    return list[Math.floor(Math.random()*list.length)];
  }

  function enemyAction() {
    if (state.enemy.dead || state.battleOver) return;
    const alive = aliveParty();
    if (!alive.length) return endBattle();
    const idx = state.enemy.actionIndex % 3;
    state.enemy.actionIndex++;
    if (idx === 0) {
      const t = randomAlive();
      addLog("敵・犬娘の「攻撃」！");
      receiveDamage(t,18,"敵・犬娘の攻撃");
    } else if (idx === 1) {
      const t = randomAlive();
      addLog("敵・犬娘の「噛みつき」！");
      receiveDamage(t,15,"敵・犬娘の噛みつき");
      if (!t.dead) {
        t.statuses.push({name:"被ダメ+30%", turns:2, damageTakenAmp:30});
        addLog(`${t.name}に被ダメージ+30%（2ターン）。`,"system");
      }
    } else {
      addLog("敵・犬娘の「駆け回る」！");
      const first = randomAlive();
      receiveDamage(first,10,"敵・犬娘の駆け回る");
      if (aliveParty().length > 1) {
        const second = randomAlive([first.id]);
        if (second) receiveDamage(second,10,"敵・犬娘の駆け回る");
      }
    }
    if (!aliveParty().length) endBattle();
  }

  function applyIncomingAmp(unit, amount) {
    const amp = unit.statuses.reduce((s,x)=>s+(x.damageTakenAmp||0),0);
    return amount * (1 + amp/100);
  }

  // overwrite receiveDamage to incorporate statuses
  const _receiveDamage = receiveDamage;
  receiveDamage = function(unit, amount, source) {
    return _receiveDamage(unit, applyIncomingAmp(unit, amount), source);
  };

  function normalAttackPhase() {
    for (const unit of state.party) {
      if (state.enemy.dead || state.battleOver) break;
      if (unit.dead) continue;
      const atk = effectiveAtk(unit);
      dealToEnemy(unit, atk, "通常攻撃", true);

      if (state.enemy.dead) break;

      if (unit.id === "dog" && state.turn % 3 === 0) {
        state.enemy.damageAmpTimed.push({value:10, turns:2});
        state.reason = Math.min(10, state.reason + 1);
        addLog(`噛みつき：敵の被ダメージ+10%（2ターン） / 理力+1（${state.reason}）`,"system");
      }
      if (unit.id === "slug") {
        state.enemy.damageAmpPermanent = Math.min(30, state.enemy.damageAmpPermanent + 2);
        addLog(`ぬめぬめ：敵の被ダメージ+2%（累積 ${state.enemy.damageAmpPermanent}%）`,"system");
      }
    }
  }

  function tickEndTurn() {
    // Ally statuses
    for (const u of state.party) {
      u.statuses.forEach(s => s.turns--);
      u.statuses = u.statuses.filter(s => s.turns > 0);
    }
    // Enemy timed amp
    state.enemy.damageAmpTimed.forEach(s => s.turns--);
    state.enemy.damageAmpTimed = state.enemy.damageAmpTimed.filter(s => s.turns > 0);
  }

  function runTurn(withChain=false, selectedIds=[]) {
    if (state.battleOver) return;
    addTurnHeader();

    if (withChain) runChain(selectedIds);
    if (state.battleOver) return render();

    normalAttackPhase();
    if (state.battleOver) return render();

    enemyAction();
    if (state.battleOver) return render();

    tickEndTurn();
    state.turn++;
    closeChain();
    render();
  }

  function runChain(selectedIds) {
    const selected = state.party.filter(u => selectedIds.includes(u.id) && !u.dead && u.gauge >= 100);
    if (!selected.length) {
      addLog("参加可能な魔物娘がいません。","system");
      return;
    }
    addLog(`スキルチェイン！ 参加：${selected.map(u=>u.name).join("、")}`,"system");

    for (const unit of selected) {
      if (state.enemy.dead) break;
      unit.gauge = 0;
      const atk = effectiveAtk(unit);

      if (unit.id === "slime") {
        dealToEnemy(unit, atk*1.2, "ジェルスプラッシュ", false);
        if (state.reason >= 5 && !unit.dead) {
          const heal = round1(unit.maxHp*.30);
          const before = unit.curHp;
          unit.curHp = Math.min(unit.maxHp, round1(unit.curHp + heal));
          addLog(`理力5以上：${unit.name}が ${round1(unit.curHp-before)} 回復。`,"heal");
        }
      }

      if (unit.id === "dog") {
        const mult = state.reason >= 5 ? 1.5 : 1.2;
        dealToEnemy(unit, atk*mult, "ワイルドアタック", false);
      }

      if (unit.id === "slug") {
        dealToEnemy(unit, atk*1.3, "なめくじプレス", false);
        state.reason = Math.min(10, state.reason + 1);
        addLog(`なめくじプレス：理力+1（${state.reason}）`,"system");
        if (state.reason >= 5 && !state.enemy.dead) {
          state.enemy.damageAmpPermanent = Math.min(30, state.enemy.damageAmpPermanent + 5);
          addLog(`理力5以上：敵の被ダメージ+5%。`,"system");
        }
      }
    }

    if (!state.enemy.dead) {
      addLog("宝珠：未実装（今回は効果なし）","system");
    }
  }

  function endBattle() {
    if (state.battleOver) return;
    state.battleOver = true;
    if (state.enemy.dead) {
      const slug = state.party.find(u=>u.id==="slug");
      if (slug && !slug.dead) {
        const heal = round1(slug.maxHp*.05);
        const before = slug.curHp;
        slug.curHp = Math.min(slug.maxHp, round1(slug.curHp + heal));
        addLog(`ねばねば：ナメクジ娘が ${round1(slug.curHp-before)} 回復。`,"heal");
      }
      addLog("勝利！","system");
    } else {
      addLog("パーティは全滅した……","damage");
    }
    closeChain();
  }

  function openChain() {
    if (state.battleOver) return;
    state.chainOpen = true;
    renderChain();
    chainPanel.classList.add("show");
  }

  function closeChain() {
    state.chainOpen = false;
    chainPanel.classList.remove("show");
  }

  function renderChain() {
    const list = $("#chainList");
    list.innerHTML = "";
    for (const u of state.party) {
      const row = document.createElement("div");
      row.className = "chain-unit";
      const can = !u.dead && u.gauge >= 100;
      row.innerHTML = `
        <div class="chain-left">
          <img src="${u.img}" alt="">
          <div>
            <div>${u.name}</div>
            <div class="chain-desc">${u.skill} / ゲージ ${u.gauge}</div>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" data-chain="${u.id}" ${can ? "checked" : ""} ${can ? "" : "disabled"}>
          <span>${can ? "参加" : "不可"}</span>
        </label>`;
      list.appendChild(row);
    }
  }

  function render() {
    $("#turnBadge").textContent = `TURN ${state.turn}`;
    $("#enemyHpText").textContent = `${state.enemy.hp} / ${state.enemy.maxHp}`;
    $("#enemyHpFill").style.width = `${Math.max(0,state.enemy.hp/state.enemy.maxHp*100)}%`;
    $("#enemyStatus").textContent = `被ダメージ増加：${totalAmp()}%`;

    partyEl.innerHTML = "";
    for (const u of state.party) {
      const article = document.createElement("article");
      article.className = "card unit";
      const hpPct = u.maxHp ? Math.max(0,u.curHp/u.maxHp*100) : 0;
      article.innerHTML = `
        <div class="portrait"><img src="${u.img}" alt="${u.name}"></div>
        <div>
          <div class="unit-name">${u.name}</div>
          <div class="unit-meta">ATK ${effectiveAtk(u)} / ${u.ability}</div>
          <div class="mini-bars">
            <div>
              <div class="bar-label"><span>HP</span><span>${u.curHp} / ${u.maxHp}</span></div>
              <div class="bar"><div class="fill hp-fill" style="width:${hpPct}%"></div></div>
            </div>
            <div>
              <div class="bar-label"><span>SKILL</span><span>${u.gauge} / 100</span></div>
              <div class="bar"><div class="fill gauge-fill" style="width:${u.gauge}%"></div></div>
            </div>
          </div>
          <div class="resource-row">
            <span class="pill ${u.gauge>=100&&!u.dead ? "ready":""}">${u.gauge>=100&&!u.dead ? "スキル準備OK" : u.skill}</span>
            ${u.statuses.map(s=>`<span class="pill">${s.name} ${s.turns}T</span>`).join("")}
            ${u.dead ? `<span class="pill dead">戦闘不能</span>` : ""}
          </div>
        </div>`;
      partyEl.appendChild(article);
    }

    const reasonPill = document.createElement("div");
    reasonPill.className = "card";
    reasonPill.style.padding = "8px 10px";
    reasonPill.style.fontSize = "13px";
    reasonPill.innerHTML = `<strong>共有スタック：理力 ${state.reason} / 10</strong>`;
    partyEl.appendChild(reasonPill);

    $("#attackBtn").disabled = state.battleOver;
    $("#chainBtn").disabled = state.battleOver || !state.party.some(u=>!u.dead && u.gauge>=100);
    if (state.chainOpen) renderChain();
  }

  $("#attackBtn").addEventListener("click",()=>runTurn(false,[]));
  $("#chainBtn").addEventListener("click",openChain);
  $("#chainCancel").addEventListener("click",closeChain);
  $("#chainConfirm").addEventListener("click",()=>{
    const ids = [...document.querySelectorAll("[data-chain]:checked")].map(x=>x.dataset.chain);
    runTurn(true,ids);
  });
  $("#resetBtn").addEventListener("click",reset);

  reset();
})();
</script>
</body>
</html>
